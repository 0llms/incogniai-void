name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          # windows-latest has VS 2022 - tell node-gyp to use it
          $env:npm_config_msvs_version = "2022"
          node -e "const gyp = require('node-gyp'); console.log('node-gyp ok')"

      - name: Install dependencies (skip native builds)
        shell: cmd
        run: npm install --ignore-scripts

      - name: Rebuild native modules with VS 2022
        shell: cmd
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npm rebuild --msvs_version=2022 || echo "Some native modules failed, continuing..."

      - name: Build Windows package
        shell: cmd
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx gulp vscode-win32-x64-min

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: incogniAI-void-windows-x64
          path: ..\VSCode-win32-x64
          retention-days: 7
