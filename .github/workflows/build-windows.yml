name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root dependencies
        shell: cmd
        env:
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
        run: npm install --ignore-scripts

      - name: Install build sub-dependencies
        shell: cmd
        env:
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
        run: node build/npm/postinstall.js

      - name: Build Windows package
        shell: cmd
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
        run: npx gulp vscode-win32-x64-min

      - name: Zip the output
        shell: powershell
        run: |
          Compress-Archive -Path ..\VSCode-win32-x64 -DestinationPath incogniAI-void-windows-x64.zip
          Write-Host "Zip created: incogniAI-void-windows-x64.zip"

      - name: Upload to VPS via SCP Action
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "incogniAI-void-windows-x64.zip"
          target: "/var/www/incogni-ai/public/downloads/"
          strip_components: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: incogniAI-void-windows-x64
          path: incogniAI-void-windows-x64.zip
          retention-days: 7
