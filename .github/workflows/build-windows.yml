name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root dependencies
        shell: cmd
        env:
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
          npm_config_ignore_scripts: 'true'
        run: npm install --ignore-scripts

      - name: Install build sub-dependencies
        shell: cmd
        env:
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
          npm_config_ignore_scripts: 'true'
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: node build/npm/postinstall.js

      - name: Build React components
        shell: cmd
        run: npm run buildreact

      - name: Build Windows package
        shell: cmd
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_SKIP_PREINSTALL: '1'
          CI: 'true'
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npx gulp vscode-win32-x64-min

      - name: Zip the output
        shell: powershell
        run: |
          Compress-Archive -Path ..\VSCode-win32-x64 -DestinationPath incogniAI-void-windows-x64.zip
          Write-Host "Zip created: incogniAI-void-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: incogniAI-void-windows-x64
          path: incogniAI-void-windows-x64.zip
          retention-days: 7

      - name: Upload to VPS via Python SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          pip install paramiko scp
          python -c "import paramiko, os; from scp import SCPClient; ssh = paramiko.SSHClient(); ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy()); ssh.connect(os.environ['VPS_HOST'], username=os.environ['VPS_USER'], password=os.environ['VPS_PASSWORD']); scp = SCPClient(ssh.get_transport()); scp.put('incogniAI-void-windows-x64.zip', '/var/www/incogni-ai/public/downloads/incogniAI-void-windows-x64.zip'); scp.close(); print('Windows package uploaded to VPS successfully!')"
