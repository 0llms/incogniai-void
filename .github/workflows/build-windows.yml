name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (skip native builds)
        shell: cmd
        run: npm install --ignore-scripts

      - name: Rebuild native modules with VS 2022
        shell: cmd
        env:
          GYP_MSVS_VERSION: '2022'
        run: npm rebuild --msvs_version=2022 || echo "Some native modules failed, continuing..."

      - name: Build Windows package
        shell: cmd
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx gulp vscode-win32-x64-min

      - name: Zip the output
        shell: powershell
        run: |
          Compress-Archive -Path ..\VSCode-win32-x64 -DestinationPath incogniAI-void-windows-x64.zip
          Write-Host "Zip created: incogniAI-void-windows-x64.zip"

      - name: Upload to VPS via SCP
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Install sshpass for password-based SCP
          sudo apt-get install -y sshpass

          # Upload the zip to the server's downloads folder
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            incogniAI-void-windows-x64.zip \
            $VPS_USER@$VPS_HOST:/var/www/incogni-ai/public/downloads/incogniAI-void-windows-x64.zip

          echo "Uploaded to server successfully!"

      - name: Upload artifact (backup to GitHub too)
        uses: actions/upload-artifact@v4
        with:
          name: incogniAI-void-windows-x64
          path: incogniAI-void-windows-x64.zip
          retention-days: 7
